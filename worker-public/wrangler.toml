name = "zestro-customer-api"
main = "src/index.ts"
compatibility_date = "2024-11-14"
workers_dev = true

[vars]
RESTAURANT_ID = "45291381-ba84-4e2f-a60c-1c39a119c2d7"
ALLOWED_ORIGINS = "https://zestro-customer-website.pages.dev,https://live-backend-nov-14-2026.zestro-customer-website.pages.dev"
WHATSAPP_NUMBER = "+8801601987672"

[[d1_databases]]
binding = "DB"
database_name = "zestro-saas-db"
database_id = "7062f9eb-889b-46c1-87f4-03270a50b5b8"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "zestro-media"

# Publishes customer-action events to the RestaurantRealtime Durable Object owned by
# the zestro-admin-api Worker. Deploy zestro-admin-api first so the class exists.
[[durable_objects.bindings]]
name = "REALTIME"
class_name = "RestaurantRealtime"
script_name = "zestro-admin-api"
