name: Auth implementation validation

on:
  push:
    branches:
      - feat/staff-email-password-auth-implementation
  pull_request:
    branches:
      - feat/staff-email-password-auth-implementation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auth-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-build:
    name: Admin app install and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked root dependencies
        run: npm ci
      - name: Build admin app and run root typecheck
        run: npm run build

  worker-lockfile:
    name: Verify Worker lockfile is in sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Regenerate lockfile metadata without running install scripts
        working-directory: worker
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated Worker lockfile when it changes
        run: |
          if ! git diff --quiet -- worker/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add worker/package-lock.json
            git commit -m "chore(auth): sync Better Auth Worker lockfile"
            git push
          else
            echo "Worker lockfile is already synchronized."
          fi

  worker-validation:
    name: Worker install, typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install Worker dependencies
        working-directory: worker
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck Worker
        working-directory: worker
        run: npm run typecheck
      - name: Run Worker tests
        working-directory: worker
        run: npm test
