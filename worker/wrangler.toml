name = "zestro-admin-api-auth-staging"
main = "src/index.ts"
compatibility_date = "2026-11-15"
workers_dev = true

# Intentionally no production D1 or R2 bindings.
# Add only a separately provisioned staging D1 database before testing.
[vars]
ALLOWED_ORIGINS = "https://zestro-admin.pages.dev"
BETTER_AUTH_URL = "https://zestro-admin-api-auth-staging.<your-subdomain>.workers.dev"
ADMIN_APP_URL = "https://zestro-admin.pages.dev"

# No [[d1_databases]] and no [[r2_buckets]] by design.
