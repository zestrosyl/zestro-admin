name = "zestro-admin-api-auth-staging"
main = "src/index.ts"
compatibility_date = "2026-11-15"
workers_dev = true

# Dedicated staging database only. This UUID is not the production D1 UUID.
[[d1_databases]]
binding = "DB"
database_name = "zestro-auth-staging-20261115"
database_id = "db949199-24f0-4c8c-8694-c06f59168d62"
migrations_dir = "migrations"

# The staging Worker serves the admin API. Media APIs are not part of auth validation.
[vars]
ALLOWED_ORIGINS = "https://zestro-admin.pages.dev"
BETTER_AUTH_URL = "https://zestro-admin-api-auth-staging.zestro-syl.workers.dev"
ADMIN_APP_URL = "https://zestro-admin.pages.dev"
