name = "zestro-admin-api"
main = "src/index.ts"
compatibility_date = "2024-11-14"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://zestro-admin.pages.dev,https://live-backend-nov-14-2026.zestro-admin.pages.dev"
ACCESS_TEAM_DOMAIN = "icy-wave-d29d.cloudflareaccess.com"
ACCESS_AUD = "46d30912b2ddf47b1b05c8929045e3b5f54f03dfe1ea677cd7be243ebed7c902"

[[d1_databases]]
binding = "DB"
database_name = "zestro-saas-db"
database_id = "7062f9eb-889b-46c1-87f4-03270a50b5b8"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "zestro-media"

# Real-time Admin Dashboard updates (WebSocket Hibernation API).
# One RestaurantRealtime instance per restaurant; no D1 schema change.
[[durable_objects.bindings]]
name = "REALTIME"
class_name = "RestaurantRealtime"

# One-time Durable Object class creation (SQLite-backed storage, required on Workers Free).
[[migrations]]
tag = "v1-realtime"
new_sqlite_classes = ["RestaurantRealtime"]
